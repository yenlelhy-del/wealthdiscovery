name: Dashboard checks
on:
  push:
    branches: [feature/coach-dashboard, feature/email-admin-auth]
  pull_request:
    branches: [main, feature/coach-dashboard]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check server.js
          node --check admin.js
          node --check email-auth.js
      - name: Functional security tests
        run: node --test test/dashboard.test.js
