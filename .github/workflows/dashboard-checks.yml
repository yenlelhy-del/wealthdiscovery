name: Dashboard checks
on:
  push:
    branches: [feature/coach-dashboard, feature/simple-admin-onboarding, feature/kyc-customer-receipt]
  pull_request:
    branches: [main, feature/coach-dashboard, feature/simple-admin-onboarding]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: |
          node --check server.js
          node --check admin.js
          node --check kyc-email.js
          node --check simple-auth.js
          node --check scripts/create-admin-setup-link.js
      - name: Functional security tests
        run: node --test test/dashboard.test.js test/receipt.test.js
